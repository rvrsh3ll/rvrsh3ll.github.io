{{ define "main" }}
<article class="post">
  <header class="post-header">
    <p class="post-meta">
      <time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.author }} · {{ . }}{{ end }}
    </p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.tags }}
    <p class="tags">
      {{ range . }}<a href="{{ `/tags/` | relURL }}{{ . | urlize }}/">{{ . }}</a>{{ end }}
    </p>
    {{ end }}
  </header>
  <div class="post-body">
    {{ .Content }}
  </div>
  {{ with .Params.medium_url }}
  <p class="source">Originally published on <a href="{{ . }}">Medium</a>.</p>
  {{ end }}
</article>
{{ end }}
